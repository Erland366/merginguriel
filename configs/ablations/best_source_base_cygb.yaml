# Best-source-base layer ablation for cy-GB (Welsh)
# cy-GB is a known interference case — full merging hurts performance.
# Best-source-base tests whether selectively merging layers onto the
# strongest single source can mitigate interference.

ablation:
  name: "best_source_base_cygb_v1"
  description: "Best-source-base layer merging for cy-GB"

  fixed:
    target_locale: "cy-GB"
    method: "linear"
    similarity_type: "REAL"
    num_languages: 5
    include_target: false  # ExcTar mode
    model_family: "xlm-roberta-base"
    models_root: "haryos_model"
    nxn_matrix_path: "nxn_results/nxn_eval_20251027_103544/evaluation_matrix_xlm-roberta-base.csv"

  cv_source_locales:
    - "en-US"
    - "de-DE"
    - "fr-FR"
    - "es-ES"
    - "nl-NL"
    - "pt-PT"
    - "it-IT"

  db_path: "experiments_best_source_base_cygb.db"
  results_dir: "results/best_source_base/cy-GB"
  resume: true
  dry_run: false
