# Best-source-base layer ablation for sw-KE (Swahili-Kenya)
# Use best single source (from NxN zero-shot matrix) as base model.
# Merge ONLY specified layers from remaining sources onto best source.
# Non-merged layers retain best source's finetuned weights.
#
# Key question: Does merging specific layers from other sources onto the
# best source improve over the best source alone?

ablation:
  name: "best_source_base_swke_v1"
  description: "Best-source-base layer merging for sw-KE"

  fixed:
    target_locale: "sw-KE"
    method: "linear"
    similarity_type: "REAL"
    num_languages: 5
    include_target: false  # ExcTar mode
    model_family: "xlm-roberta-base"
    models_root: "haryos_model"
    nxn_matrix_path: "nxn_results/nxn_eval_20251027_103544/evaluation_matrix_xlm-roberta-base.csv"

  cv_source_locales:
    - "en-US"
    - "de-DE"
    - "fr-FR"
    - "es-ES"
    - "nl-NL"
    - "pt-PT"
    - "it-IT"

  db_path: "experiments_best_source_base_swke.db"
  results_dir: "results/best_source_base/sw-KE"
  resume: true
  dry_run: false
