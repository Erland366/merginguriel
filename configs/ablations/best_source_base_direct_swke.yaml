# Direct best-source-base layer ablation for sw-KE (Swahili-Kenya)
# No cross-validation — evaluates directly on sw-KE.
# Finds best source from NxN matrix, merges layer subsets from
# remaining sources, measures accuracy on sw-KE.

ablation:
  name: "bsb_direct_swke_v1"
  description: "Direct best-source-base layer merging for sw-KE"

  fixed:
    target_locale: "sw-KE"
    method: "linear"
    model_family: "xlm-roberta-base"
    models_root: "haryos_model"
    nxn_matrix_path: "nxn_results/nxn_eval_20251027_103544/evaluation_matrix_xlm-roberta-base.csv"

  source_locales:
    - "en-US"
    - "de-DE"
    - "fr-FR"
    - "es-ES"
    - "nl-NL"
    - "pt-PT"
    - "it-IT"

  db_path: "experiments_bsb_direct_swke.db"
  results_dir: "results/best_source_base_direct/sw-KE"
  resume: true
