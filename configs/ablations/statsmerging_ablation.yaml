# Ablation: StatsMerging validation and hyperparameter sweep
#
# Purpose: Validate gradient fix, compare task_wise vs layer_wise,
#          and sweep epoch count and SVD rank
# Targets: sq-AL (constructive), vi-VN (easy), sw-KE (hard)
#
# Run order:
#   Phase 1: Sanity check (sq-AL only, task_wise, 3 epoch counts)
#   Phase 2: Mode comparison (3 locales, task_wise vs layer_wise)
#   Phase 3: SVD rank sweep (best mode, sq-AL only)
#   Phase 4: Num languages sweep (best settings, 3 locales)
#   Phase 5: Head-to-head vs existing methods
#   Phase 6: IncTar mode

ablation:
  name: "statsmerging_ablation_v1"
  description: "StatsMerging hyperparameter sweep after gradient fix"

  fixed:
    similarity_type: "REAL"
    num_languages: 5
    include_target: false
    model_family: "xlm-roberta-base"
    models_root: "haryos_model"
    merged_models_dir: "merged_models"
    dataset_name: "AmazonScience/massive"
    text_column: "utt"

  # --- Phase 1: Sanity check ---
  phases:
    - name: "sanity_check"
      description: "Verify gradient fix: loss should decrease, accuracy should beat TIES"
      fixed:
        locales: ["sq-AL"]
        method: "statsmerging"
        statsmerging_mode: "task_wise"
        statsmerging_svd_rank: 3
        statsmerging_hidden_dim: 64
        statsmerging_num_examples: 1000
      sweep:
        statsmerging_epochs: [10, 50, 100]

    # --- Phase 2: Task-wise vs Layer-wise ---
    - name: "mode_comparison"
      description: "Compare task_wise vs layer_wise across 3 target locales"
      fixed:
        method: "statsmerging"
        statsmerging_epochs: 100
        statsmerging_svd_rank: 3
        statsmerging_hidden_dim: 64
        statsmerging_num_examples: 1000
      sweep:
        locales:
          - "sq-AL"
          - "vi-VN"
          - "sw-KE"
        statsmerging_mode:
          - "task_wise"
          - "layer_wise"

    # --- Phase 3: SVD rank ---
    - name: "svd_rank_sweep"
      description: "Test sensitivity to SVD feature richness"
      fixed:
        locales: ["sq-AL"]
        method: "statsmerging"
        statsmerging_epochs: 100
        statsmerging_hidden_dim: 64
        statsmerging_num_examples: 1000
        # statsmerging_mode: set to best from Phase 2
      sweep:
        statsmerging_svd_rank: [1, 3, 5, 10]

    # --- Phase 4: Num languages ---
    - name: "num_languages_sweep"
      description: "Test how StatsMerging scales with source count"
      fixed:
        method: "statsmerging"
        statsmerging_epochs: 100
        statsmerging_svd_rank: 3
        statsmerging_hidden_dim: 64
        statsmerging_num_examples: 1000
      sweep:
        locales:
          - "sq-AL"
          - "vi-VN"
          - "sw-KE"
        num_languages: [3, 5, 7, 10]

    # --- Phase 5: Head-to-head ---
    - name: "method_comparison"
      description: "StatsMerging vs existing methods"
      fixed:
        statsmerging_epochs: 100
        statsmerging_svd_rank: 3
        statsmerging_hidden_dim: 64
        statsmerging_num_examples: 1000
      sweep:
        locales:
          - "sq-AL"
          - "vi-VN"
          - "sw-KE"
        method:
          - "statsmerging"
          - "ties"
          - "task_arithmetic"
          - "adamerging"
          - "average"

    # --- Phase 6: IncTar ---
    - name: "inctar_mode"
      description: "Test Goal 2: enhance target model via StatsMerging"
      fixed:
        method: "statsmerging"
        include_target: true
        statsmerging_epochs: 100
        statsmerging_svd_rank: 3
        statsmerging_hidden_dim: 64
        statsmerging_num_examples: 1000
      sweep:
        locales:
          - "sq-AL"
          - "vi-VN"
          - "sw-KE"

  db_path: "experiments_statsmerging.db"
  resume: true
